name: ci

# Lightweight PR-time gate (per architecture OD1):
#   - markdown lint
#   - structural file/heading presence
#   - NFR-C2 invariant: no `[Language = python]` in shipped ObjectScript
#   - NFR-C5 invariant: no CDN references in vendored static assets
#
# TODO: add `%UnitTest` execution step once a Python-less IRIS 2024.1
# community Docker image is publicly available. Tracked in
# _bmad-output/implementation-artifacts/deferred-work.md. Until then,
# dev-host `iris_execute_tests` is the integration-test surface.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: "**/*.md"

      - name: Structural checks + invariant gates
        run: |
          set -e

          echo "::group::Structural file/heading presence"
          test -f module.xml || { echo "::error::module.xml is missing"; exit 1; }
          test -f LICENSE || { echo "::error::LICENSE is missing"; exit 1; }
          grep -q "^## Operator Prerequisites" README.md || { echo "::error::README.md is missing the '## Operator Prerequisites' H2 heading"; exit 1; }
          test -d src/SessionAgent || { echo "::error::src/SessionAgent/ directory is missing"; exit 1; }
          test -d src/static || { echo "::error::src/static/ directory is missing"; exit 1; }
          echo "Structural checks PASS"
          echo "::endgroup::"

          echo "::group::NFR-C2 invariant — no [Language = python] in src/SessionAgent/"
          if grep -rn "Language = python" src/SessionAgent/; then
            echo "::error::NFR-C2 violation: [Language = python] found in src/SessionAgent/ (see grep output above). Pure-OS-runtime invariant prohibits embedded Python in shipped classes."
            exit 1
          fi
          echo "NFR-C2 gate PASS"
          echo "::endgroup::"

          echo "::group::NFR-C5 invariant — no CDN references in src/static/"
          if grep -rEn "https://cdn\." src/static/; then
            echo "::error::NFR-C5 violation: CDN reference found in src/static/ (see grep output above). Vendored static assets must be self-hosted (no CDN dependencies per PRD)."
            exit 1
          fi
          echo "NFR-C5 gate PASS"
          echo "::endgroup::"

  # Story 5.4 AC-8 — per-release tool-call-roundtrip live-endpoint validation.
  # Runs the SAME 4-provider × 13-tool matrix the deterministic
  # SessionAgent.Test.ToolCallRoundtripIntegrationTest exercises, but against
  # REAL provider endpoints. Gated behind the four provider secrets so PRs
  # from forks (which can't see secrets) skip cleanly. Runs on push to main
  # and on release tags only — not on PRs — to avoid burning provider
  # budgets on every PR. MaxOutputTokens=50 caps per-call spend at provider
  # free-tier-friendly levels.
  #
  # Status: skeleton only. The job currently fails fast with a TODO message
  # because the project's Python-less IRIS Community Docker image is still
  # blocked (Story 1.7 deferred entry). When that image lands, replace the
  # TODO step with a checkout + zpm install + iris_execute_tests step that
  # invokes a future SessionAgent.Test.ToolCallRoundtripLive class. Until
  # then the YAML is an explicit placeholder so operators reading the
  # workflow file see the intended shape.
  tool-call-roundtrip-real-endpoint-validation:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/')
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_COMPAT_ENDPOINT_URL: ${{ secrets.OPENAI_COMPAT_ENDPOINT_URL }}
    steps:
      - name: Skip if any provider secret is unset
        run: |
          set -e
          MISSING=""
          [ -z "$OPENAI_API_KEY" ] && MISSING="$MISSING OPENAI_API_KEY"
          [ -z "$ANTHROPIC_API_KEY" ] && MISSING="$MISSING ANTHROPIC_API_KEY"
          [ -z "$GEMINI_API_KEY" ] && MISSING="$MISSING GEMINI_API_KEY"
          [ -z "$OPENAI_COMPAT_ENDPOINT_URL" ] && MISSING="$MISSING OPENAI_COMPAT_ENDPOINT_URL"
          if [ -n "$MISSING" ]; then
            echo "::notice::Skipping live-endpoint matrix — missing secrets:$MISSING"
            echo "skip=true" >> "$GITHUB_ENV"
          else
            echo "skip=false" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        if: env.skip != 'true'
        uses: actions/checkout@v4

      - name: Live-endpoint matrix run (placeholder)
        if: env.skip != 'true'
        run: |
          set -e
          # TODO (Story 1.7 follow-up + Story 5.4 AC-8 evolution): when a
          # Python-less IRIS Community Docker image becomes publicly
          # available, replace this step with:
          #   1. docker pull intersystems/iris-community:<python-less-tag>
          #   2. docker run + zpm install <repo>
          #   3. Invoke a future SessionAgent.Test.ToolCallRoundtripLive
          #      class that walks the 4×13 matrix against real endpoints
          #      with MaxOutputTokens=50; failure surfaces with
          #      provider=<name>, tool=<name>, request_id=<id>.
          echo "::notice::Live-endpoint matrix placeholder — IRIS Community Python-less image dependency unblocks this step. Tracked in deferred-work.md."
